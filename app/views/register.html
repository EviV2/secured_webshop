<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Shop - Inscription</title>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <div id="topbar"></div>

    <main>
      <section class="hero">
        <div class="container">
          <h1>Inscription</h1>

          <div style="margin-top: 80px" class="profile-card">
            <form action="/api/auth/register" method="POST">
              <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required />
              </div>
              <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required />
              </div>
              <div class="form-group">
                <label for="adresse">Adresse</label>
                <!--Rajoute du nombre de char minimum et un pattern qui oblige a mettre un charactere spécial entre ces cinq (@#?$% )-->
                <input type="text" id="adresse" name="adresse" required />
              </div>

              <div class="form-group">
                <label for="password">Mot de passe</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  minlength="6"
                  pattern="(?=.*[@#?$%]).*"
                  title="Le mot de passe doit contenir au minimum 6 charactère et un charactère spécial dans la list suivante (@#?$% )"
                  required
                  style="
                    width: 100%;
                    padding: 0.6rem 0.8rem;
                    border: 1px solid #d1d5db;
                    border-radius: 8px;
                  "
                />
              </div>

              <button type="submit" style="width: 100%; margin-top: 1rem">
                S' inscrire
              </button>
              <a style="color: lightgrey" href="/login">
                Déjà un compte ? Connectez-vous ici.
              </a>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer style="margin-top: 20px" id="contact" class="footer">
      <div class="container">
        <p>Projet pedagogique - ETML 183</p>
      </div>
    </footer>

    <script src="/js/nav.js"></script>
  </body>
</html>
